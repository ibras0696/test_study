<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      :root {
        --bg-1: #f3ede4;
        --bg-2: #e0f1ee;
        --card: #fffefb;
        --text: #1d2730;
        --muted: #66737d;
        --accent: #c24d2c;
        --ring: rgba(194, 77, 44, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "Noto Sans", sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 700px at 90% 10%, rgba(194, 77, 44, 0.15), transparent 55%),
          radial-gradient(1000px 600px at 10% 90%, rgba(30, 120, 110, 0.2), transparent 60%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        padding: 24px;
      }

      .card {
        width: min(680px, 100%);
        background: var(--card);
        border: 1px solid rgba(29, 39, 48, 0.08);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      }

      .label {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1.1;
      }

      .name {
        color: var(--accent);
        border-bottom: 3px solid var(--ring);
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        text-decoration: none;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .btn-primary {
        color: #fff;
        background: var(--accent);
        box-shadow: 0 8px 18px rgba(194, 77, 44, 0.25);
      }

      .btn-secondary {
        color: var(--text);
        background: #f8f2eb;
        border: 1px solid rgba(29, 39, 48, 0.08);
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary:hover {
        box-shadow: 0 10px 22px rgba(194, 77, 44, 0.3);
      }

      .meta {
        margin-top: 20px;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <section class="card">
      <span class="label">FastAPI + Jinja2</span>
      <h1>Привет, <span class="name">{{ username }}</span></h1>
      <p>
        Это небольшая SSR-страница на Jinja2. Шаблон получает данные из backend и
        сразу отдает готовый HTML в браузер.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/docs">Открыть Swagger</a>
        <a class="btn btn-secondary" href="/api/users/me">Проверить API</a>
      </div>
      <div class="meta">Маршрут: <strong>GET /</strong></div>
    </section>
  </body>
</html>
